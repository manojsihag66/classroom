<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr = [2,3,4,5,7,8,9,10,11,"name"];
        let sum = 0;
        let sum1 = 0;

        for(let i = 0;i<arr.length;i++){
            if(arr[i]%2==0){
                sum += arr[i];
            }  
        }
        for(let i =0; i<arr.length;i++){
            if(arr[i]%2 !== 0){
                sum1 += arr[i];
            }
        }

        console.log(sum);
        console.log(sum1);
    </script>
</body>
</html>
