<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = prompt('Enter Day No.');
        switch (a) {
            case  '1':
                document.write('Its Monday');
                break;
            case  '2':
                document.write('Its Tuesday');
                break;
            case  '3':
                document.write('Its Wednesday');
                break;
            case '4':
                document.write('Its Thrusday');
                break;
            case  '5':
                document.write('Its Friday');
                break;
            case  '6':
                document.write('Its Saturday');
                break;
            case  '7':
                document.write('Its Sunday');
                break;
            default:
                document.write('Invalid Day');


        }
    </script>
</body>
</html>
