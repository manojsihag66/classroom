<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = parseFloat(prompt('Enter No.1:'));
        let b = parseFloat(prompt('Enter No.2:'));
        let c = prompt('Enter Sign:+,-,*,/,%;');

        switch(c) {
            case '+':
                alert(parseInt(a+b));
                break;
            case '-':
                alert(a-b);
                break;
            case '*':
                alert(a*b);
                break;
            case '/':
                alert(a/b);
                break;
            case '%':
                alert(a%b);
                break;
            // case '||':
            //     alert(a||b);
            //     break;
            default:
                alert('Invalid Input');
        }
    </script>
</body>
</html>
