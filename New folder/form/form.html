<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <div style="display: flex; justify-content: center; align-items: center; box-shadow: color-mix(in srgb, color percentage, color percentage);">
      <form action="#" method="POST">
        <table border="1px solid" width="400px" height="300px">
        <tr>
          <th
          colspan="2" align="center" style="background-color: antiquewhite;"
          >
            Signup
          </th>
        </tr>
          
            <tr>
              <td><label for="a">Username</label></td>
              <td>
                <input type="text" id="a" name="firstname" placeholder="first name" />
              </td>
            </tr>
            <tr>
              <td>
                <label for="b">Last Name</label>
              </td>
              <td>
                <input type="text" id="b" name="lastname" placeholder="last name" />
              </td>
            </tr>
            <tr>
              <td>
                <label for="c">Email</label>
              </td>
              <td>
                <input type="email " id="c" name="email" placeholder="email" />
              </td>
            </tr>
            <tr>
              <td>
                <label for="d">Password</label>
              </td>
              <td>
                <input type="password" id="d" name="password" placeholder="password" />
              </td>
            </tr>
            <tr>
              <td colspan="2" align="center">
                <input type="submit" value="submit" style="background-color: beige; border-radius: 10px; padding: 10px 20px; " />
              </td>
            </tr>
          
        </tr>
        </table>
      </form>
    </div>
  </body>
</html>
